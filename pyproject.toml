[project]
name = "minigrad"
version = "0.1.0"
description = "Mini autograd engine."
readme = "README.md"
authors = [
    { name = "Carlos Ezequiel", email = "cafezequiel@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
# --cov=minigrad: only check coverage for src/minigrad
# --cov-report=term-missing: report code lines not covered
# --cov-report=html: generate HTML report
addopts = "--cov=minigrad --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"  # dots: regex to consider "__main__" or '__main__'
]


[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # PEP8 errors
    "W",  # PEP8 warnings
    "F",  # Pyflakes
    "I",  # Isort
    "B",  # flake-bugbear (catches dangerous design flaws)
]
ignore = []

[tool.ruff.lint.isort]
# Prioritize first-party imports over third-party imports
known-first-party = ["firn_micrograd"]
