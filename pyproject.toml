[project]
name = "minigrad"
version = "0.1.0"
description = "Mini autograd engine."
readme = "README.md"
authors = [
    { name = "Carlos Ezequiel", email = "cafezequiel@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage-threshold>=0.6.2",
    "docformatter>=1.7.8",
    "pydoclint>=0.9.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "ty>=0.0.58",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# --cov=minigrad: only check coverage for src/minigrad
# --cov-report=term-missing: report code lines not covered
# --cov-report=html: generate HTML report
# --cov-report=json: generate JSON report for coverage-threshold
addopts = "--cov=minigrad --cov-report=term-missing --cov-report=html --cov-report=json"
pythonpath = ["."]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise AssertionError",
    "if __name__ == .__main__.:",  # dots: regex to consider "__main__" or '__main__'
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # PEP8 errors
    "W",  # PEP8 warnings
    "F",  # Pyflakes
    "I",  # Isort
    "B",  # flake-bugbear (catches dangerous design flaws)
    "D",  # pydocstyle rules
]
ignore = [
    "D1",    # Ignore missing docstrings (only enforce on existing ones)
    "D203",  # D203: one blank line before class
                # Conflicts with D211 (no blank line before class)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
order-by-type = false
known-first-party = ["minigrad"]

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88
pre-summary-newline = false
make-summary-multi-line = false

[tool.pydoclint]
style = "google"
allow-init-docstring = true
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
skip-checking-private-functions = true
check-return-types = false
check-yield-types = false

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Ignore LSP overrides check since custom Op forward/backward have varying arity by design in autograd.
invalid-method-override = "ignore"
# Enforce explicit rule codes in ignore comments, aligning with Google's clean & readable code style guidelines.
blanket-ignore-comment = "warn"
# Require type arguments for generic collections, reinforcing explicit type safety.
missing-type-argument = "warn"
# Flag unused ignores to keep type-checking annotations clean and up-to-date.
unused-ignore-comment = "warn"
unused-type-ignore-comment = "warn"

[tool.coverage-threshold]
line_coverage_min = 80
file_line_coverage_min = 80
