name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install notebook dependencies
        run: uv sync --locked --group notebook

      - name: Run static code analysis (pre-commit)
        uses: pre-commit/action@v3.0.1
        env:
          # The no-commit-to-branch hook is designed to prevent direct commits to
          # protected branches locally. However, when run in GitHub Actions on the
          # main branch, it flags the CI checkout as an invalid direct commit.
          SKIP: no-commit-to-branch

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=src --cov-report=term-missing --cov-report=json

      - name: Run coverage threshold check
        run: uv run coverage-threshold
