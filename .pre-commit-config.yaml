repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0  # Stable release tag
    hooks:
      - id: commitlint
        stages: [ commit-msg ]
        additional_dependencies: [ "@commitlint/config-conventional" ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Use the latest stable version
    hooks:
      - id: trailing-whitespace      # Trims unnecessary trailing whitespace
      - id: end-of-file-fixer        # Ensures files end with a newline character
      - id: check-yaml               # Validates syntax for your yaml configuration files
      - id: check-added-large-files  # Prevents accidentally staging gigantic binaries (>500KB)
      - id: no-commit-to-branch      # Prevents direct commits to main/master branches
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint check
        # --fix: Automatically fix safe violations (like unused imports) on stage
        entry: uv run ruff check . --fix
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false  # rescan global workspace path (.)
      - id: ruff-format
        name: Ruff code autoformat
        entry: uv run ruff format .
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false
      - id: docformatter
        name: Docformatter autoformat
        entry: uv run docformatter --in-place -r src tests
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false
      - id: pydoclint
        name: Pydoclint signature check
        entry: uv run pydoclint src tests
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false
      - id: ty-check
        name: ty type check
        entry: uv run ty check
        language: system
        types: [python]
        stages: [pre-commit]
        pass_filenames: false
  - repo: local
    hooks:
      - id: enforce-branch-name
        name: Enforce branch naming conventions
        entry: uv run python ./scripts/enforce_branch_names.py
        language: system
        stages: [pre-push]
        pass_filenames: false

# Register pre-commit hooks:
# pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
